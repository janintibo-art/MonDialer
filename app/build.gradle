plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.mondialer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.mondialer"
        minSdk 29
        targetSdk 34
        versionCode 23
        versionName "7.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // Les bibliothèques mail embarquent chacune leurs fichiers META-INF :
    // on les exclut pour éviter les conflits de doublons à l'empaquetage.
    packaging {
        resources {
            excludes += [
                'META-INF/LICENSE.md',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE.md',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/DEPENDENCIES',
                'META-INF/INDEX.LIST',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
}
